<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Central de alertas</title>
<meta name="robots" content="noindex,nofollow">
<style>
  :root{
    --bg:#06070a;--p1:#0d0f14;--p2:#12151c;--line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.16);
    --tx:#f4f6f8;--mut:#8b93a3;--dim:#5b6372;
    --lime:#c6ff1a;--lime2:#a6e000;--limeglow:rgba(198,255,26,.35);--limebg:rgba(198,255,26,.10);
    --red:#ff4545;--redglow:rgba(255,69,69,.55);--redbg:rgba(255,69,69,.12);
    --amb:#ffb62e;--ambbg:rgba(255,182,46,.12);
    --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html{color-scheme:dark}
  body{margin:0;min-height:100vh;font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--tx);-webkit-font-smoothing:antialiased;
    background:
      radial-gradient(900px 480px at 85% -10%,rgba(198,255,26,.10),transparent 60%),
      radial-gradient(700px 400px at -10% 10%,rgba(255,255,255,.05),transparent 60%),
      linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px) 0 0/44px 44px,
      linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px) 0 0/44px 44px,
      var(--bg);background-attachment:fixed}
  a{color:inherit;text-decoration:none}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

  /* topo */
  header{position:sticky;top:0;z-index:20;background:rgba(6,7,10,.72);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
  header::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--lime),transparent);opacity:.55}
  .bar{max-width:1240px;margin:0 auto;padding:12px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .logo{width:40px;height:40px;border-radius:12px;background:#000;border:1px solid var(--limeglow);display:grid;place-items:center;box-shadow:0 0 18px -4px var(--limeglow),inset 0 0 12px rgba(198,255,26,.08)}
  .logo svg{width:26px;height:26px}
  .sweep{transform-origin:16px 16px;animation:spin 3.2s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .ttl{flex:1;min-width:200px}
  .ttl h1{margin:0;font-size:17px;letter-spacing:.02em;font-weight:700}
  .ttl h1 b{color:var(--lime)}
  .sub{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--mut);font-family:var(--mono)}
  .live{width:7px;height:7px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 0 var(--limeglow);animation:ping 2s infinite}
  @keyframes ping{0%{box-shadow:0 0 0 0 var(--limeglow)}80%,100%{box-shadow:0 0 0 9px rgba(198,255,26,0)}}
  .tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  input,button{font:inherit;color:var(--tx)}
  input{padding:9px 12px;border:1px solid var(--line2);border-radius:10px;background:var(--p1);outline:none}
  input:focus{border-color:var(--lime);box-shadow:0 0 0 3px var(--limebg)}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:9px 15px;border-radius:10px;border:1px solid var(--line2);background:var(--p1);cursor:pointer;font-weight:600;font-size:13.5px;transition:.2s}
  .btn:hover{border-color:var(--lime);color:var(--lime)}
  .btn.pri{background:var(--lime);border-color:var(--lime);color:#0a0c00;box-shadow:0 0 22px -6px var(--limeglow)}
  .btn.pri:hover{background:#d8ff55;color:#0a0c00;box-shadow:0 0 28px -2px var(--limeglow)}

  main{max-width:1240px;margin:0 auto;padding:22px;display:flex;flex-direction:column;gap:30px}
  h2{margin:0 0 14px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--mut);font-weight:700;display:flex;align-items:center;gap:10px}
  h2::before{content:"";width:18px;height:2px;background:var(--lime);box-shadow:0 0 10px var(--lime)}
  h2 .cnt{font-family:var(--mono);background:var(--p2);border:1px solid var(--line);color:var(--tx);border-radius:99px;padding:1px 10px;font-size:11.5px;letter-spacing:0}
  .panel{background:linear-gradient(180deg,var(--p2),var(--p1));border:1px solid var(--line);border-radius:18px;padding:20px;position:relative}
  .mut{color:var(--mut);font-size:13px}

  /* KPIs */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
  .kpi{position:relative;overflow:hidden;border-radius:18px;padding:18px 18px 16px;background:linear-gradient(160deg,var(--p2),var(--p1));border:1px solid var(--line);transition:transform .25s,border-color .25s,box-shadow .25s}
  .kpi:hover{transform:translateY(-3px);border-color:var(--line2)}
  .kpi::before{content:"";position:absolute;left:0;top:0;right:0;height:2px;background:var(--c,var(--line2));box-shadow:0 0 14px var(--c,transparent)}
  .kpi::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle,var(--c,transparent),transparent 70%);opacity:.18}
  .kpi b{display:block;font-family:var(--mono);font-size:38px;line-height:1.05;font-weight:700;letter-spacing:-.03em;color:var(--tx)}
  .kpi span{display:block;margin-top:6px;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
  .kpi.ok{--c:var(--lime)} .kpi.ok b{color:var(--lime);text-shadow:0 0 22px var(--limeglow)}
  .kpi.bad{--c:var(--red)} .kpi.bad.on b{color:var(--red);text-shadow:0 0 22px var(--redglow)} .kpi.bad.on{border-color:rgba(255,69,69,.4);box-shadow:0 0 30px -12px var(--redglow)}
  .kpi.wait{--c:var(--amb)} .kpi.neu{--c:#ffffff}

  /* chips */
  .chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:700;letter-spacing:.04em;white-space:nowrap;border:1px solid transparent}
  .chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
  .chip.completo,.chip.presente,.chip.coberto,.chip.resolvido,.chip.enviado{background:var(--limebg);color:var(--lime);border-color:rgba(198,255,26,.28)}
  .chip.furo,.chip.ausente,.chip.aberto,.chip.erro,.chip.vaga,.chip.falta{background:var(--redbg);color:var(--red);border-color:rgba(255,69,69,.35)}
  .chip.aguardando,.chip.cuidando,.chip.trocado,.chip.simulado,.chip.semturno{background:var(--ambbg);color:var(--amb);border-color:rgba(255,182,46,.3)}
  .chip.semturno{background:transparent;color:var(--dim);border-color:var(--line)}

  /* hubs */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:18px;align-items:start}
  .hub{border-radius:18px;background:linear-gradient(180deg,var(--p2),var(--p1));border:1px solid var(--line);overflow:hidden;position:relative;transition:transform .25s,border-color .25s}
  .hub:hover{transform:translateY(-2px)}
  .hub.s-ok{border-color:rgba(198,255,26,.22)}
  .hub.s-ok::before{content:"";position:absolute;left:0;top:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--lime),transparent)}
  .hub.s-none{opacity:.55}
  .hub.alert{border-color:var(--red);animation:alerta 1.8s ease-in-out infinite}
  @keyframes alerta{
    0%,100%{box-shadow:0 0 0 1px rgba(255,69,69,.85),0 0 14px 0 rgba(255,69,69,.30),inset 0 0 24px -14px var(--redglow)}
    50%{box-shadow:0 0 0 1px rgba(255,69,69,1),0 0 38px 6px var(--redglow),inset 0 0 34px -10px var(--redglow)}}
  .hh{padding:16px 18px 12px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .hh b{font-size:16.5px;letter-spacing:.01em}
  .lider{display:flex;align-items:center;gap:8px;margin-top:5px;font-size:12.5px;color:var(--mut)}
  .av{width:22px;height:22px;border-radius:50%;background:#000;border:1px solid var(--limeglow);color:var(--lime);display:grid;place-items:center;font-size:11px;font-weight:700}
  .faltam{display:inline-flex;align-items:center;gap:6px;margin:0 18px 12px;padding:6px 12px;border-radius:10px;background:var(--redbg);border:1px solid rgba(255,69,69,.35);color:var(--red);font-size:12.5px;font-weight:700;letter-spacing:.03em}
  .faltam i{width:7px;height:7px;border-radius:50%;background:var(--red);animation:blink 1s infinite}
  @keyframes blink{50%{opacity:.25}}
  .turno{border-top:1px solid var(--line);padding:14px 18px}
  .th{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:600;font-size:14px}
  .th small{color:var(--mut);font-family:var(--mono);font-weight:500;margin-left:8px;font-size:12px}
  .prog{height:5px;background:rgba(255,255,255,.07);border-radius:99px;overflow:hidden;margin:10px 0 6px}
  .prog i{display:block;height:100%;border-radius:99px;background:var(--lime);box-shadow:0 0 12px var(--limeglow);transition:width .6s cubic-bezier(.2,.8,.2,1)}
  .prog.furo i{background:var(--red);box-shadow:0 0 12px var(--redglow)} .prog.aguardando i{background:var(--amb);box-shadow:none}
  .pc{font-size:11.5px;color:var(--mut);display:flex;justify-content:space-between;font-family:var(--mono)}
  ul{list-style:none;margin:0;padding:0}
  .pl{margin-top:8px}
  .pl li{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
  .pl li:last-child{border-bottom:0}
  .pl .nm{display:flex;align-items:center;gap:9px;min-width:0}
  .dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--dim)}
  .dot.presente,.dot.coberto{background:var(--lime);box-shadow:0 0 8px var(--limeglow)}
  .dot.ausente,.dot.vaga{background:var(--red);box-shadow:0 0 8px var(--redglow)} .dot.aguardando{background:var(--amb)}
  .pl .hr{color:var(--mut);font-family:var(--mono);font-size:12px}
  .pl .cheg{font-family:var(--mono);font-weight:700;color:var(--lime);font-size:12px}

  /* furos */
  .furo-it{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 16px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid var(--line);border-left:3px solid var(--red);margin-bottom:9px}
  .furo-it.f-cuidando,.furo-it.f-trocado{border-left-color:var(--amb)} .furo-it.f-resolvido{border-left-color:var(--lime)}
  .furo-it b{font-size:14px} .furo-it .mut{display:block}
  .vazio{display:flex;align-items:center;gap:10px;justify-content:center;padding:18px;color:var(--mut)}
  .vazio svg{width:20px;height:20px}

  /* atividade por hub */
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .tab{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:99px;border:1px solid var(--line2);background:var(--p1);cursor:pointer;font-size:13px;font-weight:600;color:var(--mut);transition:.2s}
  .tab:hover{color:var(--tx);border-color:var(--lime)}
  .tab.sel{background:var(--lime);border-color:var(--lime);color:#0a0c00;box-shadow:0 0 20px -6px var(--limeglow)}
  .tab .n{font-family:var(--mono);font-size:11px;padding:0 7px;border-radius:99px;background:rgba(255,255,255,.1)} .tab.sel .n{background:rgba(0,0,0,.15)}
  .tab .rd{width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 8px var(--redglow);animation:blink 1.2s infinite}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:22px}
  @media(max-width:860px){.cols{grid-template-columns:1fr}}
  .colh{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin-bottom:10px;font-weight:700}
  .tl{position:relative;padding:0 0 0 22px}
  .tl::before{content:"";position:absolute;left:6px;top:8px;bottom:8px;width:1px;background:linear-gradient(var(--lime),var(--line));}
  .tl li{position:relative;display:flex;gap:12px;padding:7px 0;font-size:13.5px}
  .tl li::before{content:"";position:absolute;left:-20px;top:13px;width:9px;height:9px;border-radius:50%;background:#000;border:2px solid var(--lime);box-shadow:0 0 10px var(--limeglow)}
  .tl .hm{font-family:var(--mono);font-weight:700;color:var(--lime);min-width:44px;font-size:12.5px}
  .msgs{display:flex;flex-direction:column;gap:14px;max-height:520px;overflow:auto;padding-right:6px}
  .msgs::-webkit-scrollbar{width:6px} .msgs::-webkit-scrollbar-thumb{background:var(--line2);border-radius:9px}
  .m .meta{font-size:11.5px;color:var(--mut);margin-bottom:5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-family:var(--mono)}
  .m .meta b{color:var(--lime)}
  .bub{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:11px 14px;white-space:pre-wrap;font-size:13.5px;overflow-wrap:anywhere}
  .m.g .bub{border-color:rgba(198,255,26,.3);background:var(--limebg)}

  /* config */
  details.panel>summary{cursor:pointer;font-weight:700;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--mut);list-style:none;display:flex;justify-content:space-between;align-items:center}
  details.panel>summary::-webkit-details-marker{display:none}
  details.panel>summary::after{content:"+";font-size:20px;color:var(--lime);font-weight:400} details[open]>summary::after{content:"–"}
  details .body{margin-top:16px;overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:14px;min-width:660px}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--dim);text-align:left;padding:6px}
  td{padding:6px;border-top:1px solid var(--line);vertical-align:middle} td input{width:100%}
  .cfgrow{display:flex;gap:18px;flex-wrap:wrap;align-items:center;margin:16px 0}
  .cfgrow label{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--mut)}

  @media(max-width:600px){.bar{padding:10px 14px}main{padding:14px;gap:24px}.kpi b{font-size:30px}.grid{grid-template-columns:1fr}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><div class="bar">
  <div class="logo"><svg viewBox="0 0 32 32" fill="none"><circle cx="16" cy="16" r="13" stroke="#c6ff1a" stroke-opacity=".35" stroke-width="1.5"/><circle cx="16" cy="16" r="8" stroke="#c6ff1a" stroke-opacity=".55" stroke-width="1.5"/><g class="sweep"><path d="M16 16 L28 10" stroke="#c6ff1a" stroke-width="2" stroke-linecap="round"/></g><circle cx="16" cy="16" r="2.6" fill="#c6ff1a"/></svg></div>
  <div class="ttl"><h1>CENTRAL <b>DE ALERTAS</b></h1><div class="sub"><span class="live"></span><span id="prov">carregando…</span><span>·</span><span id="upd">—</span></div></div>
  <div class="tools"><a class="btn" href="/painel.html">← Painel de ponto</a><input type="date" id="dia"><button id="atu" class="btn pri">Atualizar</button></div>
</div></header>

<main>
  <section><div class="kpis" id="kpis"></div></section>
  <section><h2>Unidades <span class="cnt" id="tit"></span></h2><div class="grid" id="hubs"></div></section>
  <section class="panel"><h2>Furos do dia <span class="cnt" id="nf">0</span></h2><div id="furos" class="mut">Carregando…</div></section>
  <section><h2>Atividade por unidade</h2><div class="panel"><div class="tabs" id="tabs"></div><div class="cols"><div><div class="colh">Linha do tempo</div><ul class="tl" id="tl"></ul></div><div><div class="colh">Mensagens</div><div class="msgs" id="msgs"></div></div></div></div></section>
  <details class="panel"><summary>Configuração</summary><div class="body" id="cfg">Carregando…</div></details>
</main>

<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hoje=()=>new Date(Date.now()-3*3600e3).toISOString().slice(0,10);
$('dia').value=hoje();
async function get(p){const r=await fetch(p,{credentials:'same-origin'});if(r.status===401){location.href='/';throw new Error('login')}const j=await r.json();if(!r.ok)throw new Error(j.error||r.status);return j}
const ST={completo:'Completo',furo:'Com furo',aguardando:'Aguardando',presente:'Presente',ausente:'Ausente',coberto:'Coberto','vaga vazia':'Vaga vazia',aberto:'Aberto',cuidando:'Cuidando',trocado:'Trocado',resolvido:'Resolvido'};
const ini=n=>String(n||'?').trim().charAt(0).toUpperCase();
const GERAL='Gestão e relatórios';
let J=null,SEL=null;

function anima(el,to){const from=+el.dataset.v||0;el.dataset.v=to;if(from===to||matchMedia('(prefers-reduced-motion:reduce)').matches){el.textContent=to;return}
  const t0=performance.now(),dur=600;(function f(t){const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);el.textContent=Math.round(from+(to-from)*e);if(k<1)requestAnimationFrame(f)})(t0)}

function info(h){const ts=h.turnos;const falta=ts.reduce((a,t)=>a+t.pessoas.filter(p=>p.estado==='ausente'||p.estado==='vaga vazia').length,0);
  const furo=ts.some(t=>t.status==='furo');const tem=ts.length>0;const ok=tem&&ts.every(t=>t.status==='completo');
  const alerta=tem&&(furo||falta>0);
  const rank=!tem?3:alerta?0:ok?2:1;return {h,falta,furo,tem,ok,alerta,rank}}

async function load(){
  const d=$('dia').value;let j;
  try{j=await get('/api/alerta/painel?d='+d)}catch(e){$('hubs').innerHTML='<div class="panel">'+esc(e.message)+'</div>';return}
  J=j;
  $('tit').textContent=d.split('-').reverse().join('/');
  $('prov').textContent=j.provedor==='ligado'?'WhatsApp ligado':'modo simulado · nada é enviado';
  $('upd').textContent='atualizado '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  const L=(j.resumo?.hubs||[]).map(info).sort((a,b)=>a.rank-b.rank||b.falta-a.falta||String(a.h.nome).localeCompare(String(b.h.nome)));
  J.L=L;

  let nOk=0,nFuro=0,nWait=0,vagas=0,presentes=0,esperados=0;
  L.forEach(x=>{if(!x.tem)return;if(x.alerta)nFuro++;else if(x.ok)nOk++;else nWait++;
    x.h.turnos.forEach(t=>{presentes+=t.presentes;esperados+=t.esperados;vagas+=t.pessoas.filter(p=>p.estado==='vaga vazia').length})});
  const abertos=j.furos.filter(f=>f.estado!=='resolvido').length;
  const K=[['ok',nOk,'Unidades completas'],['bad',nFuro,'Unidades com falta'],['wait',nWait,'Aguardando início'],['bad',abertos,'Furos em aberto'],['neu',null,'Presentes / esperados',presentes+'/'+esperados],['neu',vagas,'Vagas sem ninguém']];
  if(!$('kpis').children.length)$('kpis').innerHTML=K.map(()=>'<div class="kpi"><b class="mono"></b><span></span></div>').join('');
  [...$('kpis').children].forEach((el,i)=>{const [c,v,l,txt]=K[i];el.className='kpi '+c+(c==='bad'&&v>0?' on':'');el.querySelector('span').textContent=l;const b=el.querySelector('b');if(v===null){b.textContent=txt}else anima(b,v)});

  $('hubs').innerHTML=L.map(({h,falta,furo,tem,ok,alerta})=>{
    const cls=!tem?'s-none':alerta?'alert s-furo':ok?'s-ok':'s-wait';
    return `<div class="hub ${cls}"><div class="hh"><div><b>${esc(h.nome)}</b><div class="lider"><span class="av">${esc(ini(h.lider))}</span>${h.lider?esc(h.lider):'líder não definido'}</div></div>
      <span class="chip ${!tem?'semturno':alerta?'furo':ok?'completo':'aguardando'}">${!tem?'Sem turno':alerta?'Com falta':ok?'Completo':'Aguardando'}</span></div>
    ${falta>0?`<div class="faltam"><i></i>${falta} ${falta>1?'pessoas faltando':'pessoa faltando'}</div>`:''}
    ${h.turnos.map(t=>{const pct=t.esperados?Math.round(100*t.presentes/t.esperados):0;
      return `<div class="turno"><div class="th"><span>${esc(t.nome)}<small>${esc(t.inicio)}</small></span><span class="chip ${t.status}">${ST[t.status]||t.status}</span></div>
      <div class="prog ${t.status}"><i style="width:${pct}%"></i></div><div class="pc"><span>${t.presentes} de ${t.esperados} presentes</span><span>${pct}%</span></div>
      <ul class="pl">${t.pessoas.map(p=>{const e=p.estado==='vaga vazia'?'vaga':p.estado;return `<li><span class="nm"><i class="dot ${e}"></i><span>${esc(p.nome)}</span></span><span style="display:flex;gap:10px;align-items:center"><span class="hr">${esc(p.previsto)}</span>${p.chegou?`<span class="cheg">${esc(p.chegou)}</span>`:`<span class="chip ${e}">${esc(ST[p.estado]||p.estado)}</span>`}</span></li>`}).join('')}</ul></div>`}).join('')}</div>`}).join('')||'<div class="panel vazio">Sem dados para este dia ainda. O vigia roda a cada 5 minutos.</div>';

  $('nf').textContent=j.furos.length;
  $('furos').innerHTML=j.furos.length?j.furos.map(f=>`<div class="furo-it f-${f.estado}"><div><b>${esc(f.hub)} · ${esc(f.turno)} <span class="mono" style="color:var(--mut);font-weight:500">${esc(f.inicio)}</span></b><span class="mut">${f.vazia?'Vaga sem ninguém escalado':esc(f.nome)}${f.substituto?` → coberto por ${esc(f.substituto)}`:''}</span></div><span class="chip ${f.estado}">${ST[f.estado]||esc(f.estado)}</span></div>`).join(''):'<div class="vazio"><svg viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="9" stroke="#c6ff1a" stroke-width="1.5"/><path d="M6 10.5l2.7 2.7L14 7.5" stroke="#c6ff1a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Nenhum furo neste dia.</div>';
  atividade();
}

function atividade(){
  if(!J)return;
  const ev={},ms={};
  J.linha.forEach(e=>(ev[e.hub]=ev[e.hub]||[]).push(e));
  J.mensagens.forEach(m=>{const k=m.hub||GERAL;(ms[k]=ms[k]||[]).push(m)});
  const alertaDe={};J.L.forEach(x=>alertaDe[x.h.nome]=x.alerta);
  const nomes=[...J.L.map(x=>x.h.nome)];
  Object.keys(ev).concat(Object.keys(ms)).forEach(k=>{if(!nomes.includes(k))nomes.push(k)});
  const abas=nomes.filter(n=>(ev[n]||[]).length||(ms[n]||[]).length);
  if(!abas.length){$('tabs').innerHTML='';$('tl').innerHTML='<li class="mut">Sem eventos neste dia.</li>';$('msgs').innerHTML='<div class="vazio">Nenhuma mensagem neste dia.</div>';return}
  if(!abas.includes(SEL))SEL=abas[0];
  $('tabs').innerHTML=abas.map(n=>`<button class="tab ${n===SEL?'sel':''}" data-n="${esc(n)}">${alertaDe[n]?'<i class="rd"></i>':''}${esc(n)}<span class="n">${(ev[n]||[]).length}/${(ms[n]||[]).length}</span></button>`).join('');
  $('tabs').querySelectorAll('.tab').forEach(b=>b.onclick=()=>{SEL=b.dataset.n;atividade()});
  const E=ev[SEL]||[],M=ms[SEL]||[];
  $('tl').innerHTML=E.map(e=>`<li><span class="hm">${esc(e.hm)}</span><span><span class="mut">${esc(e.turno)}</span> ${esc(e.msg)}</span></li>`).join('')||'<li class="mut">Sem eventos nesta unidade.</li>';
  $('msgs').innerHTML=M.map(m=>`<div class="m ${m.para_quem==='gestor'?'g':''}"><div class="meta"><b>${esc(m.hm)}</b> para ${esc(m.para_quem==='gestor'?'gestora':'líder')} ${esc(m.para)} <span class="chip ${m.estado||''}">${esc(m.estado||'')}</span></div><div class="bub">${esc(m.texto)}</div></div>`).join('')||'<div class="vazio">Nenhuma mensagem nesta unidade.</div>';
}

let CFG=null,HUBS=[];
async function loadCfg(){
  const [c,h]=await Promise.all([get('/api/alerta/config'),get('/api/alerta/escala-hubs').catch(()=>({hubs:[]}))]);CFG=c.config||{hubs:{},gestor:{}};HUBS=h.hubs;
  const v=(x)=>esc(x??'');
  $('cfg').innerHTML=`<table><tr><th>Hub na escala</th><th>Líder</th><th>WhatsApp do líder</th><th>Hub(s) no Tangerino</th><th>Unidade(s) freela</th></tr>
  ${HUBS.map(h=>{const c=CFG.hubs[h.id]||{};return `<tr data-h="${esc(h.id)}"><td><b>${esc(h.nome)}</b></td><td><input data-k="nome" value="${v(c.lider?.nome)}"></td><td><input data-k="tel" value="${v(c.lider?.tel)}" placeholder="5531999999999"></td><td><input data-k="ponto" value="${v((c.ponto||[]).join(', '))}"></td><td><input data-k="freela" value="${v((c.freela||[]).join(', '))}"></td></tr>`}).join('')}</table>
  <div class="cfgrow"><label>Gestora (WhatsApp) <input id="gt" value="${v(CFG.gestor?.tel)}" placeholder="5531999999999"></label>
   <label>Relatório às <input id="rh" type="number" min="0" max="23" style="width:70px" value="${v(CFG.relatorioHora??10)}"> h</label></div>
  <div class="cfgrow"><label>Tolerância (min) <input id="tol" type="number" style="width:80px" value="${v(CFG.tolerancia??15)}"></label>
   <label>Subir para a gestora após (min) <input id="esc" type="number" style="width:80px" value="${v(CFG.escalarMin??15)}"></label>
   <label>Lembrete a cada (min) <input id="lem" type="number" style="width:80px" value="${v(CFG.lembreteMin??30)}"></label></div>
  <button id="sv" class="btn pri">Salvar configuração</button> <span id="svm" class="mut"></span>`;
  $('sv').onclick=async()=>{const hubs={};document.querySelectorAll('tr[data-h]').forEach(tr=>{const g=k=>tr.querySelector(`[data-k=${k}]`).value.trim(),l=s=>s.split(',').map(x=>x.trim()).filter(Boolean);
      hubs[tr.dataset.h]={lider:{nome:g('nome'),tel:g('tel')},ponto:l(g('ponto')),freela:l(g('freela'))}});
    const r=await fetch('/api/alerta/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tolerancia:$('tol').value,escalarMin:$('esc').value,lembreteMin:$('lem').value,relatorioHora:+$('rh').value,gestor:{tel:$('gt').value.trim()},hubs})});
    $('svm').textContent=r.ok?'Salvo ✔':'Erro ao salvar'}
}
$('atu').onclick=load;$('dia').onchange=load;load();loadCfg().catch(e=>$('cfg').textContent=e.message);setInterval(load,60000);
</script>
