<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0f0a">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="favicon-180.png">
  <title>Escala de turnos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
<script>if(/[?&]embed=1/.test(location.search)){document.documentElement.classList.add('embed');document.write('<link rel="stylesheet" href="/orion/embed.css">')}</script>
</head>
<body>
  <header class="topo">
    <div class="topo-marca">
      <span class="marca">Escala</span>
      <span class="marca-sub">Lançamento de turnos</span>
    </div>
    <nav class="topo-acoes">
      <button type="button" class="topo-link" id="btnAdmin">Entrar como admin</button>
      <a class="topo-link" href="cadastros.html">Cadastros</a>
    </nav>
  </header>

  <div class="lembrete" id="lembrete" hidden></div>
  <div class="lembrete lembrete-alerta" id="cadTel" hidden></div>

  <section class="seletor">
    <label class="campo">
      <span>Supervisor</span>
      <select id="selSupervisor"></select>
    </label>
    <label class="campo">
      <span>Hub</span>
      <select id="selHub" disabled></select>
    </label>
  </section>

  <main class="area">
    <div class="aviso" id="aviso" hidden></div>

    <div id="painel" hidden>
      <div class="barra">
        <div class="nav-periodo">
          <button type="button" class="btn-icone" id="btnAnterior" aria-label="Período anterior">‹</button>
          <button type="button" class="btn-icone" id="btnProximo" aria-label="Próximo período">›</button>
          <h1 id="tituloPeriodo"></h1>
          <button type="button" class="btn-texto" id="btnHoje">Hoje</button>
        </div>
        <div class="barra-dir">
          <p class="resumo" id="resumoPeriodo"></p>
          <div class="alternador" role="group" aria-label="Visualização">
            <button type="button" data-modo="semana" aria-pressed="true">Semana</button>
            <button type="button" data-modo="mes" aria-pressed="false">Mês</button>
          </div>
        </div>
      </div>
      <div id="quadro"></div>
    </div>
  </main>

  <dialog id="dlgAdmin" class="dlg-admin" aria-labelledby="dlgAdminTitulo">
    <div class="dlg-cab">
      <h2 id="dlgAdminTitulo">Entrar como administradora</h2>
      <button type="button" class="btn-icone" id="dlgAdminFechar" aria-label="Fechar">×</button>
    </div>
    <form id="formAdmin" class="dlg-corpo">
      <p>Pra aprovar os lançamentos direto por aqui.</p>
      <label class="campo">
        <span>Senha</span>
        <input type="password" id="senhaAdmin" autocomplete="current-password" required>
      </label>
      <p class="erro" id="erroAdmin" role="alert"></p>
      <button class="btn-primario" type="submit">Entrar</button>
    </form>
  </dialog>

  <dialog id="dlgDia" class="dlg-dia" aria-labelledby="dlgTitulo">
    <div class="dlg-cab">
      <h2 id="dlgTitulo"></h2>
      <button type="button" class="btn-icone" id="dlgFechar" aria-label="Fechar">×</button>
    </div>
    <div class="dlg-corpo" id="dlgCorpo"></div>
  </dialog>

  <div class="status" id="status" role="status" aria-live="polite"></div>

  <script type="module" src="escala.js"></script>
  <script defer src="custom-select.js"></script>
  <script defer src="hora-mascara.js"></script>
</body>
</html>
