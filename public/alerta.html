<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Furo de escala</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23050607'/><circle cx='16' cy='16' r='11' fill='none' stroke='%23baff1a' stroke-opacity='.45' stroke-width='1.8'/><circle cx='16' cy='16' r='6' fill='none' stroke='%23baff1a' stroke-opacity='.7' stroke-width='1.8'/><path d='M16 16 L25.5 9.5' stroke='%23baff1a' stroke-width='2.4' stroke-linecap='round'/><circle cx='16' cy='16' r='2.6' fill='%23baff1a'/></svg>">
<meta name="robots" content="noindex,nofollow">
<style>
  :root{--bg:#f4f5f9;--card:#fff;--tx:#1b2030;--mut:#707789;--bd:#e6e8ef;--soft:#f0f1f6;--pri:#5b2a86;--prisoft:#f1eaf8;--red:#c62828;--redbg:#fdecec;--ok:#14803a;--okbg:#e4f5ea;--warn:#8a5a00;--warnbg:#fff3d1;--sh:0 1px 2px rgba(20,24,40,.05),0 6px 18px rgba(20,24,40,.06)}
  @media(prefers-color-scheme:dark){:root{--bg:#101218;--card:#1a1d26;--tx:#e9ebf2;--mut:#98a0b3;--bd:#2a2e3a;--soft:#232734;--pri:#b48be0;--prisoft:#2a2038;--red:#ff8f85;--redbg:#3a1e21;--ok:#7fdc9b;--okbg:#17301f;--warn:#ffd27a;--warnbg:#3a2f12;--sh:none}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased}
  main{max-width:480px;margin:0 auto;padding:16px 16px 40px;display:flex;flex-direction:column;gap:14px}
  .brand{display:flex;align-items:center;gap:10px;padding:4px 2px;color:var(--mut);font-size:13px;font-weight:600}
  .logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#5b2a86,#7a45a8);display:grid;place-items:center;color:#fff;font-size:15px}
  .hero{border-radius:20px;padding:20px;background:var(--card);border:1px solid var(--bd);box-shadow:var(--sh);border-top:6px solid var(--red)}
  .hero.h-cuidando,.hero.h-trocado{border-top-color:#d9a400} .hero.h-resolvido{border-top-color:var(--ok)}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:99px;font-size:13px;font-weight:700}
  .chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
  .aberto{background:var(--redbg);color:var(--red)} .cuidando,.trocado{background:var(--warnbg);color:var(--warn)} .resolvido{background:var(--okbg);color:var(--ok)}
  h1{margin:12px 0 2px;font-size:22px;line-height:1.2}
  .who{display:flex;gap:12px;align-items:center;margin-top:14px;padding:12px;background:var(--soft);border-radius:14px}
  .av{width:42px;height:42px;border-radius:50%;background:var(--prisoft);color:var(--pri);display:grid;place-items:center;font-weight:800;font-size:18px;flex:none}
  .who b{display:block;font-size:17px} .mut{color:var(--mut);font-size:14px}
  .card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--sh)}
  .card h2{margin:0;font-size:15px}
  button,input{font:inherit;padding:15px;border-radius:14px;border:1px solid var(--bd);background:var(--card);color:var(--tx);width:100%}
  input:focus{outline:2px solid color-mix(in srgb,var(--pri) 45%,transparent);outline-offset:1px}
  button{cursor:pointer;font-weight:700;background:#5b2a86;color:#fff;border-color:#5b2a86;font-size:16px}
  button.sec{background:var(--card);color:var(--pri);border-color:var(--pri)} button:disabled{opacity:.55;cursor:default}
  button:active:not(:disabled){transform:scale(.99)}
  .ok-box{display:flex;gap:12px;align-items:center}
  .ok-box .tick{width:38px;height:38px;border-radius:50%;background:var(--okbg);color:var(--ok);display:grid;place-items:center;font-size:20px;flex:none}
  .hist{list-style:none;margin:0;padding:0 0 0 18px;position:relative;font-size:14px}
  .hist::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--bd)}
  .hist li{position:relative;padding:5px 0;display:flex;gap:10px}
  .hist li::before{content:"";position:absolute;left:-17px;top:11px;width:9px;height:9px;border-radius:50%;background:var(--pri);border:2px solid var(--card)}
  .hist b{font-variant-numeric:tabular-nums;min-width:42px}
  .err{color:var(--red);font-size:14px;min-height:18px}
</style>
</head>
<body>
<main id="m"><div class="card mut">Carregando…</div></main>
<script>
const q=new URLSearchParams(location.search),D=q.get('d'),F=q.get('f'),T=q.get('t'),m=document.getElementById('m');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ROT={aberto:'Aguardando você',cuidando:'Você está cuidando',trocado:'Troca informada · aguardando chegada',resolvido:'Encerrado'};
let colab=[];
async function api(path,body){const r=await fetch(path,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({d:D,f:F,t:T,...body})}:undefined);const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Erro '+r.status);return j}
async function load(){
  try{const j=await api(`/api/alerta/furo?d=${encodeURIComponent(D)}&f=${encodeURIComponent(F)}&t=${encodeURIComponent(T)}`);colab=j.colaboradores;draw(j.furo)}
  catch(e){m.innerHTML=`<div class="card"><h2>Link inválido</h2><div class="mut">${esc(e.message)}</div></div>`}
}
function draw(f){
  const quem=f.vazia?'Vaga sem ninguém escalado':esc(f.nome);
  const ev=f.eventos.map(e=>`<li><b>${esc(e.hm)}</b><span>${esc(e.msg)}</span></li>`).join('');
  m.innerHTML=`<div class="brand"><span class="logo">🚨</span>Alerta de escala</div>
    <div class="hero h-${f.estado}"><span class="chip ${f.estado}">${ROT[f.estado]||f.estado}</span>
      <h1>${esc(f.hubNome)} · ${esc(f.turno)}</h1>
      <div class="who"><span class="av">${f.vazia?'?':esc(String(f.nome||'?').charAt(0).toUpperCase())}</span><div><b>${quem}</b><span class="mut">Previsto ${esc(f.inicioHm)} às ${esc(f.fimHm)}${f.substituto?` · cobertura: <b style="display:inline">${esc(f.substituto.nome)}</b>`:''}</span></div></div></div>
    ${f.estado==='resolvido'?`<div class="card"><div class="ok-box"><span class="tick">✓</span><div><b>Tudo certo, este furo foi encerrado.</b><div class="mut">Você não precisa fazer mais nada.</div></div></div></div>`:`
    <div class="card"><button id="b1" ${f.estado==='cuidando'?'disabled':''}>${f.estado==='cuidando'?'✔ Já avisei que estou cuidando':'Estou cuidando'}</button>
      <div class="mut">Avisa que você já viu e está resolvendo.</div></div>
    <div class="card"><h2>Já cobri com outra pessoa</h2>
      <input id="sub" list="lc" placeholder="Nome de quem vai cobrir" autocomplete="off"><datalist id="lc">${colab.map(n=>`<option value="${esc(n)}">`).join('')}</datalist>
      <button id="b2" class="sec">Informar quem cobriu</button><div class="err" id="er"></div>
      <div class="mut">Lembre de ajustar o nome na escala também. Você será avisado quando a pessoa bater o ponto.</div></div>`}
    <div class="card"><h2>Histórico</h2><ul class="hist">${ev||'<li class="mut">Sem registros.</li>'}</ul></div>`;
  const b1=document.getElementById('b1'),b2=document.getElementById('b2');
  if(b1)b1.onclick=()=>go(b1,{acao:'cuidando'});
  if(b2)b2.onclick=()=>go(b2,{acao:'trocou',substituto:document.getElementById('sub').value});
}
async function go(btn,body){btn.disabled=true;const er=document.getElementById('er');if(er)er.textContent='';
  try{await api('/api/alerta/responder',body);await load()}catch(e){if(er)er.textContent=e.message;else alert(e.message);btn.disabled=false}}
load();
</script>
</body>
</html>
