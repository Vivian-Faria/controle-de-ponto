<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ponto Freelancer</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23050607'/><circle cx='16' cy='16' r='11' fill='none' stroke='%23baff1a' stroke-opacity='.45' stroke-width='1.8'/><circle cx='16' cy='16' r='6' fill='none' stroke='%23baff1a' stroke-opacity='.7' stroke-width='1.8'/><path d='M16 16 L25.5 9.5' stroke='%23baff1a' stroke-width='2.4' stroke-linecap='round'/><circle cx='16' cy='16' r='2.6' fill='%23baff1a'/></svg>">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#050607">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#050607;--card:#0c0f11;--tx:#f5f7f6;--mut:#8d95a3;--dim:#5d6572;--bd:rgba(255,255,255,.10);--bd2:rgba(255,255,255,.18);
    --glass:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.016));--pri:#baff1a;--limeglow:rgba(186,255,26,.38);
    --red:#ff4a4a;--amb:#ffb62e;--grn:#baff1a;--blu:#8ab8ff;
    --redbg:rgba(255,74,74,.12);--ambbg:rgba(255,182,46,.12);--grnbg:rgba(186,255,26,.10);--blubg:rgba(138,184,255,.12);
    --disp:"Space Grotesk","Segoe UI",system-ui,sans-serif;--body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
  *{box-sizing:border-box}
  html{color-scheme:dark}
  body{margin:0;min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden;font-family:var(--body);color:var(--tx);
    background:radial-gradient(900px 480px at 82% -10%,rgba(186,255,26,.11),transparent 62%),linear-gradient(rgba(255,255,255,.026) 1px,transparent 1px) 0 0/52px 52px,linear-gradient(90deg,rgba(255,255,255,.026) 1px,transparent 1px) 0 0/52px 52px,var(--bg);background-attachment:fixed}
  .brand{display:flex;align-items:center;gap:10px;font:700 17px var(--disp);letter-spacing:.04em;margin:0;color:var(--tx)}
  .brand svg{width:24px;height:24px;flex:none}.brand b{color:var(--pri)}
  .sweep{transform-origin:16px 16px;animation:spin 3.2s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
  a{color:inherit}
  input,select,button{font:inherit;color:var(--tx);border:1px solid var(--bd2);border-radius:99px;background:rgba(255,255,255,.04);outline:none;color-scheme:dark;transition:.2s}
  input::placeholder{color:#6a7280}
  input:focus,select:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(186,255,26,.10)}
  select option{background:#0c0f11;color:var(--tx)}
  button{cursor:pointer;font-weight:700;background:var(--pri);border-color:var(--pri);color:#071000}
  button:hover{background:#d4ff5e;border-color:#d4ff5e}
  button.ghost{background:rgba(255,255,255,.05);color:var(--tx);border-color:var(--bd2);font-weight:600}button.ghost:hover{border-color:var(--pri);color:var(--pri);background:rgba(255,255,255,.05)}
  button:disabled{opacity:.55;cursor:wait}
  .chip{display:inline-block;border-radius:99px;font:600 11.5px var(--mono);letter-spacing:.04em;white-space:nowrap}
  body{font-size:16px;line-height:1.5}
  header{position:sticky;top:0;z-index:30;padding:14px 18px;background:rgba(7,9,10,.78);backdrop-filter:blur(16px);border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
  header a{color:var(--mut);font-size:14px;text-decoration:none;padding:8px 14px;border:1px solid var(--bd);border-radius:99px}header a:hover{color:var(--pri);border-color:var(--pri)}
  main{max-width:560px;margin:0 auto;padding:18px 16px 70px;display:flex;flex-direction:column;gap:18px}
  h2{font:700 19px var(--disp);letter-spacing:-.015em;margin:0 0 12px}
  section{background:var(--glass);border:1px solid var(--bd);border-radius:28px;padding:22px;backdrop-filter:blur(10px);box-shadow:0 30px 60px -44px #000}
  input,select,button{padding:15px 20px;width:100%}
  select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 22px) 52%,calc(100% - 16px) 52%;background-size:6px 6px;background-repeat:no-repeat;padding-right:40px}
  button{font-size:16px;box-shadow:0 0 34px -12px var(--limeglow)}button.ghost{box-shadow:none}
  form{display:flex;flex-direction:column;gap:12px}label{font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mut);display:block;margin:0 0 6px 6px}
  .person{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;border-radius:22px;background:rgba(255,255,255,.04);color:var(--tx);border:1px solid var(--bd);font-weight:500;margin-bottom:10px;box-shadow:none}
  .person:hover{background:rgba(186,255,26,.06);border-color:rgba(186,255,26,.4);color:var(--tx)}
  .person small{color:var(--mut);display:block;font-size:12.5px;margin-top:2px}.person b{font:600 16px var(--disp)}
  .chip{padding:4px 12px}
  .atividade{background:var(--grnbg);color:var(--grn)}.intervalo{background:var(--ambbg);color:var(--amb)}
  .err{background:var(--redbg);color:var(--red);padding:14px 18px;border-radius:20px;border:1px solid rgba(255,74,74,.3);display:none}.okm{background:var(--grnbg);color:var(--grn);padding:14px 18px;border-radius:20px;display:none}
  .acts{display:grid;gap:12px;margin-top:14px}.acts button{padding:20px;font-size:19px;font-family:var(--disp);letter-spacing:-.01em}.acts button.fin{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 0 34px -10px rgba(255,74,74,.6)}.acts button.fin:hover{background:#ff6b6b}
  dl{display:grid;grid-template-columns:auto 1fr;gap:10px 16px;margin:0}dt{color:var(--mut)}dd{margin:0;font-weight:600;text-align:right;word-break:break-word}
  .total{font:700 30px var(--disp);color:var(--grn);letter-spacing:-.02em}.aviso{font-size:13px;color:var(--mut);margin-top:12px}
  .hide{display:none!important}
  #cam{position:fixed;inset:0;background:rgba(0,0,0,.82);backdrop-filter:blur(6px);z-index:50;display:none;align-items:center;justify-content:center;padding:14px}
  #cam .box{background:#0a0d0f;border:1px solid var(--bd2);border-radius:30px;padding:18px;max-width:440px;width:100%;display:flex;flex-direction:column;gap:12px}
  #cam video{width:100%;border-radius:22px;background:#000;transform:scaleX(-1);aspect-ratio:3/4;object-fit:cover;border:1px solid var(--bd)}
  #cam .st{font-size:13px;color:var(--mut)}#cam .st b{color:var(--tx)}
</style>
</head>
<body>
<header><h1 class="brand"><svg viewBox="0 0 32 32" fill="none"><circle cx="16" cy="16" r="13" stroke="#baff1a" stroke-opacity=".4" stroke-width="1.6"/><circle cx="16" cy="16" r="7.5" stroke="#baff1a" stroke-opacity=".6" stroke-width="1.6"/><g class="sweep"><path d="M16 16 L28 10" stroke="#baff1a" stroke-width="2.2" stroke-linecap="round"/></g><circle cx="16" cy="16" r="2.6" fill="#baff1a"/></svg><span>PONTO FREELA<b>.</b></span></h1><a href="/">Início</a></header>
<main>
  <div class="err" id="err" role="alert"></div>

  <section id="vResumo" class="hide"></section>

  <section id="vAcao" class="hide">
    <h2 id="aNome"></h2><div id="aInfo" style="color:var(--mut)"></div>
    <div class="acts" id="aBtns"></div>
    <button class="ghost" style="margin-top:12px" onclick="voltar()">Voltar à lista</button>
  </section>

  <div id="vLista">
    <section>
      <h2>Freelancers em aberto hoje</h2>
      <input id="busca" placeholder="Buscar meu nome…" oninput="desenha()" style="margin-bottom:10px">
      <div id="lista"><span style="color:var(--mut)">Carregando…</span></div>
      <div style="color:var(--mut);font-size:13px;margin-top:6px">Já bateu a entrada? Toque no seu nome para registrar almoço ou saída.</div>
    </section>
    <section style="margin-top:18px">
      <h2>Iniciar jornada (primeira batida do dia)</h2>
      <form id="fEntrada" autocomplete="off">
        <div><label for="nome">Nome completo</label><input id="nome" required minlength="5" autocomplete="name"></div>
        <div><label for="cpf">CPF</label><input id="cpf" required inputmode="numeric" maxlength="14" placeholder="000.000.000-00"></div>
        <div><label for="pix">Chave Pix</label><input id="pix" required placeholder="CPF, e-mail, telefone ou chave aleatória"></div>
        <div><label for="unidade">Unidade</label><select id="unidade" required><option value="">Escolha…</option></select></div>
        <button type="submit" id="bEntrada">Registrar entrada</button>
      </form>
    </section>
  </div>
</main>
<div id="cam" role="dialog" aria-modal="true"><div class="box">
  <h2 id="camT" style="margin:0">Tire uma foto para registrar</h2>
  <video id="camV" playsinline muted autoplay></video>
  <div class="st" id="camS"></div>
  <div class="err" id="camE" style="display:none"></div>
  <button id="camB" type="button">📷 Tirar foto e registrar</button>
  <button class="ghost" id="camC" type="button">Cancelar</button>
</div></div>
<script>
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let ABERTOS=[], SEL=null, busy=false, resumoAberto=false;
// foto ao vivo (só pela câmera, sem galeria) + localização do celular, exigidas em toda batida
function capturar(titulo){return new Promise(resolve=>{
  const box=$('cam'),v=$('camV'),B=$('camB'),E=$('camE'),S=$('camS');let stream=null,geo=null,geoSt='buscando',fim=false;
  const stat=()=>{S.innerHTML='📍 Localização: <b>'+(geoSt==='ok'?'obtida':geoSt==='buscando'?'obtendo…':'não permitida')+'</b>'};
  const fecha=r=>{if(fim)return;fim=true;if(stream)stream.getTracks().forEach(t=>t.stop());v.srcObject=null;box.style.display='none';resolve(r)};
  const falha=m=>{E.textContent=m;E.style.display='block'};
  $('camT').textContent=titulo||'Tire uma foto para registrar';E.style.display='none';B.disabled=true;box.style.display='flex';stat();
  $('camC').onclick=()=>fecha(null);
  if(navigator.geolocation)navigator.geolocation.getCurrentPosition(p=>{geo={lat:p.coords.latitude,lon:p.coords.longitude,prec:p.coords.accuracy};geoSt='ok';stat()},()=>{geoSt='negada';stat()},{enableHighAccuracy:true,timeout:15000,maximumAge:0});else{geoSt='negada';stat()}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){falha('Este navegador não permite usar a câmera. Abra o endereço no Chrome ou Safari do celular.');return}
  navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:720},height:{ideal:960}},audio:false}).then(s=>{if(fim){s.getTracks().forEach(t=>t.stop());return}stream=s;v.srcObject=s;v.play().catch(()=>{});B.disabled=false})
    .catch(()=>falha('Permita o uso da câmera nas configurações do navegador para registrar o ponto.'));
  B.onclick=async()=>{if(!v.videoWidth)return falha('A câmera ainda não carregou. Aguarde um instante.');B.disabled=true;B.textContent='Registrando…';
    const w=480,hh=Math.round(w*v.videoHeight/v.videoWidth),c=document.createElement('canvas');c.width=w;c.height=hh;c.getContext('2d').drawImage(v,0,0,w,hh);
    const foto=c.toDataURL('image/jpeg',0.6);
    for(let i=0;i<30&&geoSt==='buscando';i++)await new Promise(r=>setTimeout(r,200));      // espera até 6 s pela localização
    B.textContent='📷 Tirar foto e registrar';fecha({foto,geo,ua:navigator.userAgent})}})}
function erro(m){const e=$('err');e.textContent=m||'';e.style.display=m?'block':'none';if(m)window.scrollTo({top:0,behavior:'smooth'})}
async function api(path,body){const r=await fetch(path,{credentials:'same-origin',...(body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})});
  const j=await r.json().catch(()=>({}));if(r.status===401){await fetch('/api/freela/entrar',{method:'POST',credentials:'same-origin'});if(!api.retry){api.retry=1;try{return await api(path,body)}finally{api.retry=0}}}
  if(!r.ok)throw new Error(j.error||'Erro '+r.status);return j}
async function carrega(){try{const j=await api('/api/freela/abertos');ABERTOS=j.abertos;
    if(!$('unidade').dataset.ok){$('unidade').innerHTML='<option value="">Escolha…</option>'+j.unidades.map(u=>`<option>${esc(u)}</option>`).join('');$('unidade').dataset.ok=1}
    if(SEL){const a=ABERTOS.find(x=>x.id===SEL.id);if(a&&!busy){SEL=a;desenhaAcao()}}desenha()}catch(e){if(!resumoAberto)erro(e.message)}}
function desenha(){const q=$('busca').value.toLowerCase(),L=ABERTOS.filter(a=>a.nome.toLowerCase().includes(q));
  $('lista').innerHTML=L.length?L.map(a=>`<button class="person" onclick="escolhe('${esc(a.id)}')"><span><b>${esc(a.nome)}</b><small>${esc(a.unidade)} · desde ${a.data.split('-').reverse().slice(0,2).join('/')}${a.ultima?' · última: '+esc(a.ultima.rotulo)+' '+esc(a.ultima.hora):''}</small></span><span class="chip ${a.status}">${esc(a.statusRotulo)}</span></button>`).join(''):
    `<span style="color:var(--mut)">${ABERTOS.length?'Nenhum nome encontrado.':'Ninguém com jornada em aberto agora.'}</span>`}
function escolhe(id){SEL=ABERTOS.find(a=>a.id===id);if(!SEL)return;erro('');$('vLista').classList.add('hide');$('vAcao').classList.remove('hide');desenhaAcao()}
function desenhaAcao(){$('aNome').textContent=SEL.nome;$('aInfo').innerHTML=`${esc(SEL.unidade)} · <span class="chip ${SEL.status}">${esc(SEL.statusRotulo)}</span>${SEL.ultima?'<br>Última batida: '+esc(SEL.ultima.rotulo)+' às '+esc(SEL.ultima.hora):''}`;
  $('aBtns').innerHTML=SEL.proximos.map(p=>`<button class="${p.tipo==='saida_final'?'fin':''}" onclick="bate('${p.tipo}')" ${busy?'disabled':''}>${esc(p.rotulo)}</button>`).join('')}
function voltar(){SEL=null;resumoAberto=false;$('vAcao').classList.add('hide');$('vResumo').classList.add('hide');$('vLista').classList.remove('hide');erro('');carrega()}
async function bate(tipo){if(busy)return;busy=true;erro('');desenhaAcao();
  try{const ev=await capturar(SEL.proximos.find(p=>p.tipo===tipo)?.rotulo);if(!ev){busy=false;desenhaAcao();return}
    const j=await api('/api/freela/bater',{id:SEL.id,tipo,...ev});if(j.concluida)return mostraResumo(j.resumo);SEL=j.jornada;desenhaAcao()}
  catch(e){erro(e.message);carrega()}finally{busy=false;if(SEL)desenhaAcao()}}
function mostraResumo(r){resumoAberto=true;SEL=null;$('vAcao').classList.add('hide');$('vLista').classList.add('hide');const v=$('vResumo');v.classList.remove('hide');
  v.innerHTML=`<h2>✅ Jornada concluída</h2><dl><dt>Nome</dt><dd>${esc(r.nome)}</dd><dt>CPF</dt><dd>${esc(r.cpf)}</dd><dt>Chave Pix</dt><dd>${esc(r.pix)}</dd><dt>Unidade</dt><dd>${esc(r.unidade)}</dd><dt>Data</dt><dd>${esc(r.data.split('-').reverse().join('/'))}</dd>
  ${r.horarios.map(h=>`<dt>${esc(h.rotulo)}</dt><dd>${esc(h.hora)}</dd>`).join('')}
  ${r.intervalo_min?`<dt>Intervalo</dt><dd>${r.intervalo_min} min ${r.intervalo_descontado?'(desconta só o que passou de 30 min)':'(até 30 min, pago)'}</dd>`:''}
  <dt>Horas trabalhadas</dt><dd>${esc(r.horas)}</dd><dt>Valor da hora</dt><dd>${esc(r.valor_hora)}</dd><dt>Valor calculado a receber</dt><dd class="total">${esc(r.valor_total)}</dd></dl>
  <div class="aviso">${esc(r.aviso)} Seu registro foi salvo e será conferido pelo DP.</div><button style="margin-top:14px" onclick="voltar()">Concluir</button>`;window.scrollTo({top:0})}
$('cpf').addEventListener('input',e=>{let d=e.target.value.replace(/\D/g,'').slice(0,11);e.target.value=d.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2')});
$('fEntrada').onsubmit=async e=>{e.preventDefault();if(busy)return;busy=true;erro('');$('bEntrada').disabled=true;
  try{const ev=await capturar('Entrada — tire uma foto');if(!ev){busy=false;$('bEntrada').disabled=false;return}
    const j=await api('/api/freela/entrada',{nome:$('nome').value,cpf:$('cpf').value,pix:$('pix').value,unidade:$('unidade').value,...ev});
    $('fEntrada').reset();await carrega();escolhe(j.jornada.id)}catch(err){erro(err.message)}finally{busy=false;$('bEntrada').disabled=false;if(SEL)desenhaAcao()}};
api('/api/freela/entrar',{}).then(carrega).catch(e=>erro(e.message));setInterval(()=>{if(!document.hidden&&!SEL&&!resumoAberto)carrega()},15000);
</script>
</body>
</html>
