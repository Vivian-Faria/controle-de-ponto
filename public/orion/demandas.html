<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demandas para a gerência · Órion</title>
<link rel="icon" href="assets/favicon-brain.svg" type="image/svg+xml">
<style>
:root{--bg:#060606;--panel:#0d0e0c;--line:rgba(255,255,255,.1);--lime:#b8f400;--text:#f3f4f1;--muted:#8a8e84;--red:#ff5252}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 "Space Grotesk",system-ui,sans-serif;padding:24px 16px 60px}
main{max-width:720px;margin:0 auto}h1{font-size:28px;margin:0 0 4px}h1 span{color:var(--lime)}p.s{color:var(--muted);margin:0 0 22px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:22px}
label{display:block;font:500 11px ui-monospace,monospace;letter-spacing:.14em;color:var(--muted);margin:14px 0 6px;text-transform:uppercase}
input,select,textarea{width:100%;background:#0a0a09;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:11px 13px;font:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--lime);outline-offset:1px}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}.seg button{flex:1;padding:11px;background:transparent;color:var(--muted);border:0;font:inherit;cursor:pointer}.seg button.on{background:var(--lime);color:#0a0d00;font-weight:700}
.btn{margin-top:18px;width:100%;padding:13px;border:0;border-radius:12px;background:var(--lime);color:#0a0d00;font:700 16px inherit;cursor:pointer}
.msg{margin-top:12px;font-size:14px}.msg.ok{color:var(--lime)}.msg.er{color:var(--red)}
h2{font-size:15px;margin:0 0 10px;color:var(--muted);font-weight:500}
.it{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;background:var(--panel)}
.it b{display:block;font-weight:500}.it small{color:var(--muted)}.it .rt{margin-top:8px;padding:8px 10px;border-left:3px solid var(--lime);background:rgba(184,244,0,.07);font-size:14px}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font:700 11px ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);margin-bottom:6px}
.pill.nova{border-color:var(--red);color:var(--red)}.pill.vista{color:#e8e8e3}.pill.processo{border-color:var(--lime);color:var(--lime)}.pill.resolvida{background:var(--lime);color:#0a0d00;border-color:var(--lime)}
.empty{color:var(--muted);text-align:center;padding:24px}
</style>
</head>
<body>
<main>
<h1>Demandas para a <span>gerência</span></h1>
<p class="s">CS, DP, RH e Financeiro: lance aqui o que precisa da gerente. Você acompanha o andamento logo abaixo (nova, vista, em processo ou resolvida).</p>
<form class="card" id="f" novalidate>
  <label>Quem está lançando</label>
  <div class="seg" id="de"><button type="button" data-v="CS" class="on">CS</button><button type="button" data-v="DP">DP</button><button type="button" data-v="RH">RH</button><button type="button" data-v="Financeiro">Financeiro</button></div>
  <label for="quem">Seu nome (opcional)</label><input id="quem" maxlength="60" autocomplete="name">
  <label for="hub">Hub</label>
  <select id="hub"><option>Geral</option><option>Varanda Sion</option><option>Varanda Cidade Nova</option><option>Varanda Buritis</option><option>Varanda Castelo</option><option>Expedição Órion Sion</option></select>
  <label for="urg">Urgência</label>
  <select id="urg"><option value="baixa">Baixa</option><option value="media" selected>Média</option><option value="alta">Alta</option></select>
  <label for="txt">O que precisa</label><textarea id="txt" rows="4" maxlength="800" placeholder="Descreva a demanda com o que a gerente precisa fazer ou decidir"></textarea>
  <button class="btn" type="submit" id="ok">Enviar demanda</button>
  <div class="msg" id="msg" role="status"></div>
</form>
<h2>Demandas lançadas</h2>
<div id="lista"><div class="empty">Carregando…</div></div>
</main>
<script src="/shared/fs-core.js"></script>
<script src="/shared/fs-compat.js"></script>
<script src="assets/config.js"></script>
<script>
(function(){
const CFG = window.CENTRAL_CONFIG, $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ST = { nova:'Nova', vista:'Vista', processo:'Em processo', resolvida:'Resolvida' };
let de = 'CS', docs = [];
try{ const sv = JSON.parse(localStorage.getItem('orion_demanda') || '{}'); if(sv.de) de = sv.de; if(sv.quem) $('#quem').value = sv.quem; }catch(e){}
const setDe = () => document.querySelectorAll('#de button').forEach(b => b.classList.toggle('on', b.dataset.v === de));
setDe();
$('#de').addEventListener('click', e => { const b = e.target.closest('button'); if(!b) return; de = b.dataset.v; setDe(); draw(); });
firebase.initializeApp(CFG.FIREBASE);
const col = firebase.firestore().collection(CFG.COLLECTION || 'compras_pedidos');
function draw(){
  const l = docs.filter(d => d.de === de && !d.deleted).sort((a,b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
  $('#lista').innerHTML = l.length ? l.map(d => `<div class="it"><span class="pill ${esc(d.status)}">${esc(ST[d.status] || d.status)}</span><b>${esc(d.texto)}</b><small>${esc(d.hub || 'Geral')} · ${esc((d.createdAt || '').slice(8,10) + '/' + (d.createdAt || '').slice(5,7))}${d.quem ? ' · ' + esc(d.quem) : ''}</small>${d.retorno ? `<div class="rt"><small>Retorno da gerência</small><br>${esc(d.retorno)}</div>` : ''}</div>`).join('') : `<div class="empty">Nenhuma demanda do ${esc(de)} ainda.</div>`;
}
col.where('kind', '==', 'demanda').onSnapshot(s => { docs = s.docs.map(x => x.data()); draw(); }, err => { console.warn(err); $('#lista').innerHTML = '<div class="empty">Sem conexão com o banco. Recarregue a página.</div>'; });
$('#f').addEventListener('submit', async e => {
  e.preventDefault(); const texto = $('#txt').value.trim(), m = $('#msg'); m.className = 'msg';
  if(texto.length < 5){ m.textContent = 'Descreva o que precisa (ao menos uma frase).'; m.classList.add('er'); $('#txt').focus(); return; }
  const id = 'DX-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), now = new Date().toISOString();
  const rec = { id, kind:'demanda', de, quem:$('#quem').value.trim(), hub:$('#hub').value, urgencia:$('#urg').value, texto, status:'nova', retorno:'', createdAt:now, updatedAt:now, thread:[], deleted:false, awaiting:false, alert:null };
  $('#ok').disabled = true;
  try{ await col.doc(id).set(rec); m.textContent = 'Demanda enviada. A gerente vê na hora.'; m.classList.add('ok'); $('#txt').value = ''; try{ localStorage.setItem('orion_demanda', JSON.stringify({ de, quem:rec.quem })); }catch(e){} }
  catch(err){ console.warn(err); m.textContent = 'Não consegui enviar. Verifique a internet e tente de novo.'; m.classList.add('er'); }
  $('#ok').disabled = false;
});
})();
</script>
</body>
</html>
